<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>Meet <span>Nova</span></h1>
      <p>Your intelligent assistant for ideas, answers, and everyday tasks fast, clear, and always ready to help.</p>
      <p class="hero-credit">Powered by Shweta Bharati</p>
      <div class="hero-actions">
        <button type="button" id="start-chat" class="btn-primary">
          <span class="material-symbols-rounded">chat</span>
          Start chatting
        </button>
      </div>
    </section>
  </main>

  <div class="chatbot-popup" role="dialog" aria-label="Chat assistant">

    <aside class="chat-sidebar" role="navigation" aria-label="Chat history">
      <div class="sidebar-brand">
        <span class="material-symbols-rounded">history</span>
        <span>Chat History</span>
      </div>
      <div class="sidebar-history" id="chat-history-list">
        <div class="history-empty">No chat history yet.</div>
      </div>
      <div class="sidebar-footer">
        <button id="new-chat-btn" class="new-chat-btn">
          <span class="material-symbols-rounded">add</span>
          New chat
        </button>
      </div>
    </aside>
    <div class="sidebar-backdrop"></div>

    <header class="chat-header">
      <div class="header-info">
        <button id="sidebar-toggle" class="material-symbols-rounded" aria-label="Toggle sidebar">menu</button>
        <div class="avatar-ring">
          <svg class="chatbot-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
            <path d="M160-360q-50 0-85-35t-35-85q0-50 35-85t85-35v-80q0-33 23.5-56.5T240-760h120q0-50 35-85t85-35q50 0 85 35t35 85h120q33 0 56.5 23.5T800-680v80q50 0 85 35t35 85q0 50-35 85t-85 35v160q0 33-23.5 56.5T720-120H240q-33 0-56.5-23.5T160-200v-160Zm200-80q25 0 42.5-17.5T420-500q0-25-17.5-42.5T360-560q-25 0-42.5 17.5T300-500q0 25 17.5 42.5T360-440Zm240 0q25 0 42.5-17.5T660-500q0-25-17.5-42.5T600-560q-25 0-42.5 17.5T540-500q0 25 17.5 42.5T600-440ZM320-280h320v-80H320v80Zm-80 80h480v-480H240v480Zm240-240Z"/>
          </svg>
        </div>
        <div>
          <h2 class="logo-text">Nova Assistant</h2>
          <span class="status"><span class="status-dot"></span> <span id="status-label">Online</span></span>
        </div>
      </div>
      <button id="close-chatbot" class="material-symbols-rounded" aria-label="Close chat">expand_more</button>
    </header>

    <div class="chat-body">
      <div class="message bot-message">
        <div class="bot-avatar-wrap">
          <svg class="bot-avatar" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
            <path d="M160-360q-50 0-85-35t-35-85q0-50 35-85t85-35v-80q0-33 23.5-56.5T240-760h120q0-50 35-85t85-35q50 0 85 35t35 85h120q33 0 56.5 23.5T800-680v80q50 0 85 35t35 85q0 50-35 85t-85 35v160q0 33-23.5 56.5T720-120H240q-33 0-56.5-23.5T160-200v-160Zm200-80q25 0 42.5-17.5T420-500q0-25-17.5-42.5T360-560q-25 0-42.5 17.5T300-500q0 25 17.5 42.5T360-440Zm240 0q25 0 42.5-17.5T660-500q0-25-17.5-42.5T600-560q-25 0-42.5 17.5T540-500q0 25 17.5 42.5T600-440ZM320-280h320v-80H320v80Zm-80 80h480v-480H240v480Zm240-240Z"/>
          </svg>
        </div>
        <div class="message-content">
          <div class="message-text">Hello! I'm Nova. Ask me anything — I'm here to help.</div>
          <div class="quick-prompts">
            <button type="button" class="quick-prompt" data-prompt="Summarize this topic in simple terms">Explain simply</button>
            <button type="button" class="quick-prompt" data-prompt="Help me write a professional email">Draft an email</button>
            <button type="button" class="quick-prompt" data-prompt="Give me 5 creative project ideas">Get ideas</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="chat-footer">
      <div id="file-preview" class="file-preview hidden">
        <img id="preview-image" alt="Attachment preview">
        <button type="button" id="file-cancel" class="material-symbols-rounded" aria-label="Remove attachment">close</button>
      </div>
      <div class="chat-form">
        <textarea placeholder="Type your message..." class="message-input" rows="1"></textarea>
        <div class="chat-controls">
          <button type="button" id="emoji-picker" class="material-symbols-rounded" aria-label="Emoji picker">sentiment_satisfied</button>
          <div class="file-upload-wrapper">
            <input type="file" accept="image/*" id="file-input" hidden>
            <button type="button" id="file-upload" class="material-symbols-rounded" aria-label="Attach image">attach_file</button>
          </div>
          <button type="button" id="send-message" class="material-symbols-rounded" aria-label="Send message">arrow_upward</button>
        </div>
      </div>
    </footer>
  </div>

  <script src="index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
</body>
</html>
